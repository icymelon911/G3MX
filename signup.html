<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>G3MX - Create Account</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/signup_logo.png">

</head>

<body>
    <div class="auth-scene auth-scene-right">
        <img src="images/goblin.png" alt="Goblin" class="auth-character wobble-character auth-goblin">
        <img src="images/knight.png" alt="Knight" class="auth-character wobble-character auth-knight">
    </div>

    <div class="auth-container">
        <div class="auth-box">
            <h2>Initialize Your Learning Profile</h2>
            <p class="auth-desc">
                Create your G3MX account and begin transforming passive
                learning into an interactive, mission-based experience.
            </p>
            <form id="signupForm">
                <input type="text" id="signupUsername" placeholder="Username" required>
                <input type="email" id="signupEmail" placeholder="Email Address" required>
                <div class="password-wrapper">
                    <input type="password" id="signupPassword" placeholder="Password" required>
                    <button type="button" class="eye-toggle" id="toggleSignupPassword" title="Show password">👁️‍🗨️</button>
                </div>
                <div class="password-wrapper">
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required>
                    <button type="button" class="eye-toggle" id="toggleSignupConfirmPassword" title="Show password">👁️‍🗨️</button>
                </div>
                <button class="btn" type="submit">Create Player Account</button>
            </form>
            <a class="auth-link" onclick="location.href='login.html'">Already Have an Account? Login</a>
            <a class="auth-link" onclick="location.href='index.html'">Back to Landing Page</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>

    <script>
        const togglePwBtn = document.getElementById('toggleSignupPassword');
        const pwInput = document.getElementById('signupPassword');
        togglePwBtn.addEventListener('click', () => {
            const isPassword = pwInput.type === 'password';
            pwInput.type = isPassword ? 'text' : 'password';
            togglePwBtn.textContent = isPassword ? '🙈' : '👁️‍🗨️';
            togglePwBtn.title = isPassword ? 'Hide password' : 'Show password';
        });

        const toggleConfirmPwBtn = document.getElementById('toggleSignupConfirmPassword');
        const confirmPwInput = document.getElementById('signupConfirmPassword');
        toggleConfirmPwBtn.addEventListener('click', () => {
            const isPassword = confirmPwInput.type === 'password';
            confirmPwInput.type = isPassword ? 'text' : 'password';
            toggleConfirmPwBtn.textContent = isPassword ? '🙈' : '👁️‍🗨️';
            toggleConfirmPwBtn.title = isPassword ? 'Hide password' : 'Show password';
        });
    </script>
</body>

</html>
