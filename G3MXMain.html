    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="G3MXMain.js"></script>
    <script>
        // --- INITIALIZE FIREBASE ---
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // --- OFFLINE GEM SYNC (Godot Race Condition fix) ---
        // If Godot 2 exits before Firebase finishes saving, the pending gems fall back here.
        firebase.auth().onAuthStateChanged(function (user) {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            // Sync any stranded gems
            var pendingGems = parseInt(localStorage.getItem('pending_gems') || '0');
            if (pendingGems > 0) {
                console.log("Main Menu: Recovered " + pendingGems + " stranded gems from Godot exit.");
                localStorage.setItem('pending_gems', '0');
                firebase.firestore().collection("users").doc(user.uid).update({
                    "profileData.stats.gems": firebase.firestore.FieldValue.increment(pendingGems)
                }).catch(e => console.error("Sync failed, gems may be lost", e));
            }

            const gemDisplay = document.getElementById("userGemCount");

            // Load gem count once on page load
            firebase.firestore().collection("users").doc(user.uid).get()
                .then(function (docSnap) {
                    if (docSnap.exists) {
                        const data = docSnap.data().profileData || {};
                        const stats = data.stats || {};
                        gemDisplay.textContent = (stats.gems || 0).toLocaleString();
                        if (data.profileImageUrl && data.profileImageUrl !== "undefined" && data.profileImageUrl !== "null" && data.profileImageUrl.trim() !== "") {
                            document.getElementById("mainMenuUserAvatar").src = data.profileImageUrl;
                        }
                    }
                });

            // Listen for real-time gem updates (so returning from game auto-updates)
            firebase.firestore().collection("users").doc(user.uid)
                .onSnapshot(function (docSnap) {
                    if (docSnap.exists) {
                        const stats = (docSnap.data().profileData || {}).stats || {};
                        gemDisplay.textContent = (stats.gems || 0).toLocaleString();
                    }
                });
        });
    </script>
    <script>
        (function () {
            const c = document.getElementById("snowflakes");
            const ctx = c.getContext("2d");
            c.width = window.innerWidth; c.height = window.innerHeight;
            const flakes = [];
            for (let i = 0; i < 220; i++) flakes.push({ x: Math.random() * c.width, y: Math.random() * c.height, r: Math.random() * 1.5, s: Math.random() * 0.5 });
            (function draw() {
                ctx.clearRect(0, 0, c.width, c.height); ctx.fillStyle = "#ffffff";
                flakes.forEach(f => { ctx.fillRect(Math.round(f.x), Math.round(f.y), Math.ceil(f.r * 2), Math.ceil(f.r * 2)); f.y += f.s; if (f.y > c.height) f.y = 0; });
                requestAnimationFrame(draw);
            })();
        })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
