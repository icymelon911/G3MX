<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G3MX — Avatar Shop</title>
  <link rel="stylesheet" href="profile.css">
  <link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Pixelify+Sans:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    /* ===== SHOP CONTAINER ===== */
    .shop-container {
      width: 100%;
      max-width: 900px;
      padding: 2rem;
      background: var(--ck-panel-bg);
      border: 4px solid var(--ck-border-dark);
      border-top-color: var(--ck-border-light);
      border-left-color: var(--ck-border-light);
      box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.6);
      image-rendering: pixelated;
    }

    .shop-title {
      font-size: 2rem;
      color: var(--ck-gold);
      text-align: center;
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 3px;
      margin-bottom: 2rem;
      text-transform: uppercase;
    }

    /* ===== AVATAR SECTION ===== */
    .avatar-section {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: var(--ck-slot-bg);
      padding: 1.5rem;
      border: 4px solid var(--ck-border-dark);
      border-bottom-color: var(--ck-border-light);
      border-right-color: var(--ck-border-light);
      box-shadow: inset 4px 4px 10px rgba(0, 0, 0, 0.5), 4px 4px 0px rgba(0, 0, 0, 0.4);
      margin-bottom: 2rem;
    }

    .avatar-ring {
      position: relative;
      width: 110px;
      height: 110px;
      flex-shrink: 0;
      background: var(--ck-bg-deep);
      border: 4px solid var(--ck-border-dark);
      border-bottom-color: var(--ck-border-light);
      border-right-color: var(--ck-border-light);
      box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.8);
      overflow: visible;
    }

    .avatar-ring img.base-bot {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
    }

    .cosmetic-layer {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      display: none;
      image-rendering: pixelated;
    }

    #avatarFrame {
      z-index: 10;
      width: 154px;
      height: 154px;
      top: -22px;
    }

    #avatarHat {
      z-index: 30;
      width: 132px;
      height: 132px;
      top: -82px;
      clip-path: inset(0% 0% 25% 0%);
    }

    #avatarGlasses {
      z-index: 25;
      width: 110px;
      top: 16px;
      clip-path: inset(10% 0% 10% 0%);
    }

    .avatar-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .gem-display {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.6rem;
      color: var(--ck-gold);
      text-shadow: 2px 2px 0 #000;
    }

    .gem-display img {
      width: 20px;
      height: 20px;
      image-rendering: pixelated;
      vertical-align: middle;
    }

    #equippedLabel {
      font-size: 1.1rem;
      color: var(--ck-text-dim);
      text-shadow: 1px 1px 0 #000;
      letter-spacing: 1px;
      line-height: 1.6;
    }

    /* ===== DIVIDER ===== */
    .shop-divider {
      border: none;
      border-top: 4px dashed var(--ck-border-dark);
      margin: 0 0 2rem 0;
    }

    /* ===== SHOP GRID ===== */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1.5rem;
    }

    /* ===== ITEM CARD (inventory slot style) ===== */
    .card {
      background: var(--ck-slot-bg);
      padding: 1.25rem;
      border: 4px solid var(--ck-border-dark);
      border-bottom-color: var(--ck-border-light);
      border-right-color: var(--ck-border-light);
      box-shadow: inset 4px 4px 10px rgba(0, 0, 0, 0.5), 4px 4px 0px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      transition: border-color 0.15s;
    }

    .card:hover {
      border-color: var(--ck-border-light);
    }

    .img-container {
      width: 80px;
      height: 80px;
      background: var(--ck-bg-deep);
      border: 4px solid var(--ck-border-dark);
      border-bottom-color: var(--ck-border-light);
      border-right-color: var(--ck-border-light);
      box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card img.item-preview {
      max-width: 60px;
      max-height: 60px;
      image-rendering: pixelated;
    }

    .item-name {
      font-size: 1.2rem;
      color: var(--ck-text-main);
      text-align: center;
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 1px;
    }

    .item-price {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 1.1rem;
      color: var(--ck-gold);
    }

    .item-price img {
      width: 14px;
      height: 14px;
      image-rendering: pixelated;
    }

    /* ===== BUY BUTTON (copper / save-btn style) ===== */
    .btn-buy {
      width: 100%;
      background: var(--ck-copper);
      color: white;
      font-family: "Jersey 15", sans-serif;
      font-size: 1.4rem;
      padding: 0.6rem 1rem;
      border: 4px solid var(--ck-border-dark);
      border-top-color: #e58255;
      border-left-color: #e58255;
      cursor: pointer;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 #000;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      transition: background 0.1s;
    }

    .btn-buy:hover {
      background: var(--ck-copper-hover);
    }

    .btn-buy:active {
      transform: translateY(4px) translateX(4px);
      box-shadow: none;
      border-top-color: var(--ck-border-dark);
      border-left-color: var(--ck-border-dark);
    }

    /* EQUIP — teal */
    .btn-buy.owned {
      background: #1a6b55;
      border-top-color: #38d9a9;
      border-left-color: #38d9a9;
    }

    .btn-buy.owned:hover {
      background: #1f7d63;
    }

    /* UNEQUIP — red */
    .btn-buy.equipped {
      background: #a33232;
      border-top-color: #d14747;
      border-left-color: #d14747;
    }

    .btn-buy.equipped:hover {
      background: #ba3a3a;
    }

    /* ===== TOAST ===== */
    #toast-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .shop-toast {
      background: var(--ck-panel-bg);
      border: 4px solid var(--ck-crystal-glow);
      box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.8);
      padding: 1rem 1.5rem;
      font-family: "Jersey 15", sans-serif;
      font-size: 1.3rem;
      color: var(--ck-text-main);
      text-shadow: 2px 2px 0 #000;
      animation: toastIn 0.2s ease;
    }

    @keyframes toastIn {
      from {
        transform: translateX(20px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    canvas#snowflakes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .shop-container,
    #toast-container {
      position: relative;
      z-index: 10;
    }
  </style>
</head>

<body>

  <canvas id="snowflakes"></canvas>
  <a href="G3MXMain.html" class="back-btn">Back</a>
  <button class="logout-btn" id="logoutBtn">Log Out</button>

  <div class="shop-container">

    <h1 class="shop-title">◆ Avatar Shop ◆</h1>

    <!-- Avatar preview -->
    <div class="avatar-section">
      <div class="avatar-ring">
        <img id="userAvatar" class="base-bot" src="https://api.dicebear.com/7.x/bottts/svg?seed=g3mx">
        <img id="avatarFrame" class="cosmetic-layer">
        <img id="avatarHat" class="cosmetic-layer">
        <img id="avatarGlasses" class="cosmetic-layer">
      </div>
      <div class="avatar-info">
        <div class="gem-display">
          <img src="images/gem.png" alt="Gem"> <span id="gemCount">0</span> Gems
        </div>
        <div id="equippedLabel">Nothing Equipped</div>
      </div>
    </div>

    <hr class="shop-divider">

    <div class="shop-grid" id="cosmeticShop"></div>

  </div>

  <div id="toast-container"></div>

  <script>
    (function () {
      const c = document.getElementById("snowflakes");
      const ctx = c.getContext("2d");
      c.width = window.innerWidth; c.height = window.innerHeight;
      const flakes = [];
      for (let i = 0; i < 220; i++) flakes.push({ x: Math.random() * c.width, y: Math.random() * c.height, r: Math.random() * 1.5, s: Math.random() * 0.5 });
      (function draw() {
        ctx.clearRect(0, 0, c.width, c.height); ctx.fillStyle = "#ffffff";
        flakes.forEach(f => { ctx.fillRect(Math.round(f.x), Math.round(f.y), Math.ceil(f.r * 2), Math.ceil(f.r * 2)); f.y += f.s; if (f.y > c.height) f.y = 0; });
        requestAnimationFrame(draw);
      })();
    })();
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUserId = null;
    let userState = {
      gems: 0,
      ownedItems: [],
      equipped: { frame: null, hat: null, glasses: null },
      profilePic: ""
    };

    const cosmetics = [
      { name: "Gold Frame", type: "frame", price: 1, image: "images/goldframe.png" },
      { name: "Green Frame", type: "frame", price: 1, image: "images/green frame.png" },
      { name: "Wizard Hat", type: "hat", price: 5, image: "images/wizard hat.png" },
      { name: "Cool Shades", type: "glasses", price: 3, image: "images/sunglasses.png" },
      { name: "Construction Hat", type: "hat", price: 3, image: "images/construction hat.png" },
      { name: "Nerd Glasses", type: "glasses", price: 3, image: "images/nerd.png" }
    ];

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      if (confirm("Log out?")) {
        auth.signOut().then(() => window.location.href = "index.html");
      }
    });

    async function pullFromFirebase() {
      if (!currentUserId) return;
      try {
        const docSnap = await db.collection("users").doc(currentUserId).get();
        if (docSnap.exists) {
          const data = docSnap.data().profileData || {};
          userState.gems = (data.stats || {}).gems || 0;
          userState.ownedItems = data.ownedItems || [];
          const eq = data.equipped || {};
          userState.equipped = {
            frame: eq.frame || null,
            hat: eq.hat || null,
            glasses: eq.glasses || null
          };
          userState.profilePic = data.profileImageUrl || "";
        }
      } catch (e) {
        console.error("Failed to load shop data:", e);
        showToast("Could not load your data.");
      }
      updateUI();
    }

    async function pushToFirebase() {
      if (!currentUserId) return;
      try {
        await db.collection("users").doc(currentUserId).update({
          "profileData.ownedItems": userState.ownedItems,
          "profileData.equipped": userState.equipped,
          "profileData.stats.gems": userState.gems
        });
      } catch (e) {
        console.error("Failed to save:", e);
        showToast("Save failed. Try again.");
      }
    }

    function updateUI() {
      document.getElementById("gemCount").textContent = userState.gems;
      if (userState.profilePic) {
        document.getElementById("userAvatar").src = userState.profilePic;
      }
      applyVisuals();
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById("cosmeticShop");
      container.innerHTML = "";

      cosmetics.forEach(item => {
        const isOwned = userState.ownedItems.includes(item.name);
        const isEquipped = userState.equipped[item.type] === item.name;

        let btnClass = "btn-buy";
        let btnLabel = "BUY";
        if (isEquipped) { btnClass += " equipped"; btnLabel = "UNEQUIP"; }
        else if (isOwned) { btnClass += " owned"; btnLabel = "EQUIP"; }

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="img-container">
            <img src="${item.image}" class="item-preview">
          </div>
          <div class="item-name">${item.name}</div>
          <div class="item-price">
            <img src="images/gem.png"> ${item.price} Gems
          </div>
          <button class="${btnClass}">${btnLabel}</button>`;

        card.querySelector("button").onclick = async () => {
          if (isEquipped) {
            userState.equipped[item.type] = null;
            showToast("Unequipped.");
          } else if (!isOwned) {
            if (userState.gems < item.price) { showToast("Not enough Gems!"); return; }
            userState.gems -= item.price;
            userState.ownedItems.push(item.name);
            userState.equipped[item.type] = item.name;
            showToast("Purchased & Equipped!");
          } else {
            userState.equipped[item.type] = item.name;
            showToast("Equipped!");
          }
          await pushToFirebase();
          updateUI();
        };

        container.appendChild(card);
      });
    }

    function applyVisuals() {
      document.querySelectorAll(".cosmetic-layer").forEach(l => l.style.display = "none");
      const labels = [];
      for (const type in userState.equipped) {
        if (!userState.equipped[type]) continue;
        const item = cosmetics.find(c => c.name === userState.equipped[type]);
        const layerId = type === "frame" ? "avatarFrame" : (type === "hat" ? "avatarHat" : "avatarGlasses");
        const layer = document.getElementById(layerId);
        if (layer && item) { layer.src = item.image; layer.style.display = "block"; labels.push(item.name); }
      }
      document.getElementById("equippedLabel").textContent =
        labels.length > 0 ? labels.join(" + ") : "Nothing Equipped";
    }

    function showToast(m) {
      const t = document.createElement("div");
      t.className = "shop-toast";
      t.textContent = m;
      document.getElementById("toast-container").appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    updateUI();

    auth.onAuthStateChanged(user => {
      if (user) { currentUserId = user.uid; pullFromFirebase(); }
      else { window.location.href = "index.html"; }
    });
  </script>
</body>

</html>
